name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # LTS estable con npm 10; evita rarezas de npm ci en runners muy nuevos.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          node -v
          npm -v
          ls -la package.json package-lock.json 2>/dev/null || true
          # `npm ci` exige lock idéntico al repo y falla con el volcado de ayuda si falta lock o hay desajuste.
          # `npm install` usa package-lock si existe y suele ser suficiente para generar dist/.
          npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
